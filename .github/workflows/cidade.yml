name: Cidade das contribuições

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Gerar a cidade com as contribuições reais
        run: node perfil/gerar-cidade.js
        env:
          GITHUB_TOKEN: ${{ secrets.PERFIL_TOKEN }}
          USUARIO: ${{ github.repository_owner }}

      - name: Salvar a cidade nova
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add perfil/cidade.svg
          git diff --cached --quiet || git commit -m "Atualiza a cidade das contribuições"
          git push
