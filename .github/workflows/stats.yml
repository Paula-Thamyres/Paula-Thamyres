name: GitHub Stats

on:
  schedule:
    - cron: "47 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Gerar o Stats com os números reais
        run: node perfil/gerar-stats.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USUARIO: ${{ github.repository_owner }}

      - name: Salvar o Stats novo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add perfil/stats.svg
          git diff --cached --quiet || git commit -m "Atualiza o GitHub Stats"
          git pull --rebase
          git push
